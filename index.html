<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="hr">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Šahomanija Split - Službeni portal" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:title" content="Šahomanija Split" />
    <meta property="og:image" content="favicon.png" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <title>Šahomanija Split</title>
    <style type="text/css">
        body {
            background-color: #d9dfe6;
            background-image: url("bg.jpeg"), linear-gradient(to bottom, #c5ced8 0%, #e6eaef 300px);
            background-position: center top, left top;
            background-size: cover, 100% 300px;
            background-repeat: no-repeat, repeat-x;
            background-attachment: fixed, scroll;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 12px;
            color: #333333;
            margin: 0;
            padding: 20px 0;
        }

        #wrapper {
            width: 920px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #99a6b5;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
        }

        #header {
            background: linear-gradient(to bottom, #1e4b7a 0%, #102e4d 100%);
            color: #ffffff;
            padding: 25px 25px;
            border-bottom: 4px solid #cc8400;
            text-align: center;
        }

        #header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: -0.5px;
            text-shadow: 1px 1px 2px #000000;
        }

        #content {
            padding: 45px 25px;
            text-align: center;
        }

        .status-msg {
            font-size: 14px;
            color: #333333;
            margin: 0 0 22px 0;
        }

        .archive-link {
            display: inline-block;
            background: linear-gradient(to bottom, #ffffff 0%, #e0e0e0 100%);
            border: 1px solid #999999;
            border-radius: 3px;
            padding: 7px 18px;
            font-size: 12px;
            font-weight: bold;
            color: #1e4b7a;
            text-decoration: none;
        }

        .archive-link:hover {
            background: linear-gradient(to bottom, #ffffff 0%, #e8eef5 100%);
            color: #102e4d;
            border-color: #1e4b7a;
        }

        #footer {
            background-color: #f2f4f7;
            border-top: 1px solid #dce1e7;
            padding: 12px 25px;
            font-size: 11px;
            color: #777777;
            text-align: center;
        }

        @media screen and (max-width: 950px) {
            body { padding: 10px; }
            #wrapper { width: 100%; }
            #header { padding: 18px 15px; }
            #header h1 { font-size: 19px; }
            #content { padding: 30px 15px; }
        }
    </style>
</head>
<body>

<div id="wrapper">
    <div id="header">
        <h1>ŠAHOMANIJA SPLIT</h1>
    </div>

    <div id="content">
        <p class="status-msg">Trenutno se ne odvija niti jedan Šahomanija turnir.</p>
        <a href="/arhiva" class="archive-link">Arhiva</a>
    </div>

    <div id="footer">
        Interna organizacija turnira © 2026–2026 | Powered by Vanjaka
    </div>
</div>

</body>
</html>
